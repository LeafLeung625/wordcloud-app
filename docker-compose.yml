version: '3.8'

services:
  wordcloud:
    build: .
    container_name: wordcloud-app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=your-production-secret-key-change-this
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./static:/app/static
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
